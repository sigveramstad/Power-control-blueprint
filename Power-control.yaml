
blueprint:
  name: "Nordpool Price – Expensive Hours Control (Reversed Logic)"
  description: >
    Turn a device (e.g., water heater) **ON** during the most expensive Nord Pool price hours and **OFF** during the cheapest hours. 
    Allows configuring how many hours per day are considered "expensive" (device ON), and ensures the device doesn't stay OFF for more than a set number of hours consecutively.
  domain: automation

  input:
    nordpool_sensor:
      name: Nord Pool Price Sensor
      description: "Select your Nord Pool price sensor."
      selector:
        entity:
          domain: sensor
          integration: nordpool   # Ensures only Nord Pool sensors are shown
    expensive_hours_on:
      name: Expensive Hours On (per day)
      description: "Number of highest-priced hours per day to run the device."
      default: 12
      selector:
        number:
          min: 1
          max: 24
          mode: slider
          step: 1
    max_off_hours:
      name: Max Consecutive OFF Hours
      description: "Max number of hours the device can stay OFF in a row before it's forced ON."
      default: 5
      selector:
        number:
          min: 1
          max: 24
          mode: slider
          step: 1
    always_on_price:
      name: Always ON Price Threshold
      description: "If price rises above this value, force device ON (override schedule). Leave high if not used."
      default: 5.0
      selector:
        number:
          min: 0.0
          max: 20.0
          step: 0.1
    turn_on_actions:
      name: Turn ON Actions
      description: "Actions to run when turning the device ON (e.g., turn on heater switch)."
      selector:
        action: {}
    turn_off_actions:
      name: Turn OFF Actions
      description: "Actions to run when turning the device OFF."
      selector:
        action: {}

variables:
  sensor_entity: !input nordpool_sensor        # The Nord Pool sensor entity (for convenience in templates)
  hours_on: !input expensive_hours_on          # Number of expensive hours to turn on
  max_off: !input max_off_hours                # Max allowed consecutive off hours
  high_thr_price: !input always_on_price       # High price threshold to always turn on

trigger:
  - platform: state
    entity_id: !input nordpool_sensor          # Trigger whenever the Nord Pool price sensor updates

action:
  # 1. Calculate the threshold price and check off-hour limit using the sensor's attributes
  - variables:
      price_list: >-
        {{ state_attr(sensor_entity, 'today') | list }}   {# List of today's prices from the sensor attribute #}
      total_count: >-
        {{ price_list | length if price_list is not none else 0 }}
      sorted_prices: >-
        {{ price_list | sort if price_list is not none else [] }} 
      # Determine the price that separates "expensive" hours from "cheap" hours.
      # If hours_on = X, threshold_price = the X-th most expensive price (i.e., (24-X)th cheapest).
