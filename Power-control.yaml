blueprint:
  name: Nordpool price based on expensive hours on
  description: >
    This blueprint uses the nordpool integration and lets you turn ON
    devices during the most expensive hours of the day.
  domain: automation

  input:
    grid_area:
      name: Grid area sensor
      selector:
        entity:
          domain: sensor
          integration: nordpool

    start_minute:
      name: Start minute
      default: 0
      selector:
        number:
          min: 0
          max: 59
          mode: slider
          step: 1

    end_minute:
      name: End minute
      default: 0
      selector:
        number:
          min: 0
          max: 59
          mode: slider
          step: 1

    hour_rank:
      name: Hours on (most expensive)
      description: Number of most expensive hours per day to turn ON
      default: 12
      selector:
        number:
          min: 0
          max: 24
          mode: slider
          step: 1

    hour_ratio:
      name: Hour percent (from max price)
      description: >
        Max percent difference from daily maximum price to turn ON devices
      default: 50
      selector:
        number:
          min: 0
          max: 100
          mode: slider
          step: 5

    allways_on:
      name: Always on price
      description: If price is ABOVE this value device is always ON
      default: 20
      selector:
        number:
          min: 0
          max: 20
          mode: slider
          step: 0.1

    allways_off:
      name: Always off price
      description: If price is BELOW this value device is always OFF
      default: 0
      selector:
        number:
          min: 0
          max: 20
          mode: slider
          step: 0.1

    turnon:
      name: Turn On actions
      selector:
        action: {}

    turnoff:
      name: Turn Off actions
      selector:
        action: {}

variables:
  grid_area_var: !input grid_area
  hour_rank_input: !input hour_rank
  hour_rank_var: "{{ (hour_rank_input | float * 4) | int }}"
  hour_ratio_var: !input hour_ratio
  allways_on_var: !input allways_on
  allways_off_var: !input allways_off
  start_minute_var: !input start_minute
  end_minute_var: !input end_minute

  prices: "{{ state_attr(grid_area_var, 'today') | list }}"
  idx: "{{ (now().hour * 4) + (now().minute // 15) }}"
  price: "{{ prices[idx] | float if idx < prices | length else prices[-1] | float }}"

  sorted_prices: "{{ prices | sort }}"
  max_price: "{{ sorted_prices[-1] }}"
  min_price: "{{ sorted_prices[0] }}"
  diff: "{{ max_price - min_price }}"

  below_high: "{{ max_price - price }}"
  ratio: "{{ ((below_high / diff) * 100) | round if diff > 0 else 0 }}"

  rank_expensive: "{{ (sorted_prices | reverse).index(price) + 1 }}"

  condition_always_on_price: "{{ price >= allways_on_var | float }}"
  condition_price_ratio: "{{ ratio | int <= hour_ratio_var | int }}"
  condition_rank_expensive_hours: "{{ rank_expensive | int <= hour_rank_var | int }}"

  seton: >
    {{ condition_always_on_price
       or condition_price_ratio
       or condition_rank_expensive_hours }}

  result: "{{ price > allways_off_var and seton }}"

trigger:
  - platform: time_pattern
    minutes: !input start_minute
  - platform: time_pattern
    minutes: !input end_minute

action:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ result }}"
        sequence: !input turnon
    default: !input turnoff

mode: single
