blueprint:
  name: Nordpool – varmtvann DYRESTE timer + prisuavhengig tvang
  description: >
    Slår varmtvann PÅ i X dyreste timer basert på Nordpool (kun i dag).
    Hvis varmtvann har vært AV i mer enn N timer, tvinges den PÅ i 1 time
    uavhengig av strømpris.
  domain: automation

  input:
    nordpool_sensor:
      name: Nordpool-prissensor
      selector:
        entity:
          domain: sensor

    target_entity:
      name: Varmtvannsbryter
      selector:
        entity:
          domain: switch

    expensive_hours:
      name: Antall dyreste timer (PÅ)
      default: 4
      selector:
        number:
          min: 1
          max: 24

    max_off_hours:
      name: Maks sammenhengende AV-tid (timer)
      default: 5
      selector:
        number:
          min: 1
          max: 24

variables:
  ga: !input nordpool_sensor
  target: !input target_entity
  eh: !input expensive_hours
  mo: !input max_off_hours
  force_flag: input_boolean.nordpool_force_hotwater

trigger:
  - platform: time_pattern
    minutes: "/30"

action:
  - variables:
      prices: "{{ state_attr(ga, 'today') }}"

      priced_hours: >
        {% set out = [] %}
        {% for i in range(prices | length) %}
          {% set out = out + [(i, prices[i])] %}
        {% endfor %}
        {{ out }}

      # Dyreste først
      sorted_hours: >
        {{ priced_hours | sort(attribute=1, reverse=true) }}

      expensive_hours_idx: >
        {% set res = [] %}
        {% for h in sorted_hours[:eh] %}
          {% set res = res + [h[0]] %}
        {% endfor %}
        {{ res }}

      current_hour: "{{ now().hour }}"
      is_expensive: "{{ current_hour in expensive_hours_idx }}"

      is_on: "{{ is_state(target, 'on') }}"
      force_active: "{{ is_state(force_flag, 'on') }}"

      hours_off: >
        {% if is_on %}
          0
        {% else %}
          {{ (as_timestamp(now()) - as_timestamp(states[target].last_changed)) / 3600 }}
        {% endif %}

      force_elapsed: >
        {% if force_active %}
          {{ as_timestamp(now()) - as_timestamp(states[force_flag].last_changed) }}
        {% else %}
          0
        {% endif %}

  - choose:

      # 🔴 START TVANG – uavhengig av pris
      - conditions:
          - condition: template
            value_template: "{{ hours_off >= mo and not force_active }}"
        sequence:
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.nordpool_force_hotwater
          - service: switch.turn_on
            target:
              entity_id: !input target_entity

      # 🔥 TVANG AKTIV (maks 1 time)
      - conditions:
          - condition: template
            value_template: "{{ force_active and force_elapsed < 3600 }}"
        sequence:
          - service: switch.turn_on
            target:
              entity_id: !input target_entity

      # 💰 DYRESTE TIMER
      - conditions:
          - condition: template
            value_template: "{{ is_expensive }}"
        sequence:
          - service: switch.turn_on
            target:
              entity_id: !input target_entity

    # ❄️ AV ellers
    default:
      - service: switch.turn_off
        target:
          entity_id: !input target_entity

  # 🔁 Avslutt tvang etter 1 time
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ force_active and force_elapsed >= 3600 }}"
        sequence:
          - service: input_boolean.turn_off
            target:
              entity_id: input_boolean.nordpool_force_hotwater

mode: single
