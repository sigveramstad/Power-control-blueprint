blueprint:
  name: "Nordpool Price – Expensive Hours Control (Reversed Logic)"
  description: >
    Turn a device (e.g., water heater) ON during the most expensive Nord Pool price hours 
    and OFF during the cheapest hours. Configurable number of expensive hours per day, 
    with a safety limit on max consecutive off-hours. (No VAT or fixed fees in calculation.)
  domain: automation

  input:
    nordpool_sensor:
      name: Nord Pool Price Sensor
      description: "Select your Nord Pool price sensor entity."
      selector:
        entity:
          domain: sensor
          integration: nordpool   # Only show Nord Pool sensors in the dropdown
    expensive_hours_on:
      name: Expensive Hours On (per day)
      description: "Number of highest-priced hours per day to turn the device ON."
      default: 12
      selector:
        number:
          min: 1
          max: 24
          mode: slider
          step: 1
    max_off_hours:
      name: Max Consecutive OFF Hours
      description: "Maximum hours the device can stay OFF in a row before being forced ON."
      default: 5
      selector:
        number:
          min: 1
          max: 24
          mode: slider
