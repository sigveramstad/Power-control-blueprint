blueprint:
  name: "Nordpool Price – Expensive Hours Control (Reversed Logic)"
  description: >
    Turn a device (e.g., water heater) ON during the most expensive Nord Pool price hours 
    and OFF during the cheapest hours. Configurable number of expensive hours per day, with a safety 
    limit on max consecutive off-hours (no VAT or fixed fees considered).
  domain: automation

  input:
    nordpool_sensor:
      name: Nord Pool Price Sensor
      description: "Select your Nord Pool price sensor (entity)."
      selector:
        entity:
          domain: sensor
          integration: nordpool   # Dropdown filters to Nord Pool sensors
    expensive_hours_on:
      name: Expensive Hours On (per day)
      description: "Number of highest-priced hours per day to turn the device ON."
      default: 12
      selector:
        number:
          min: 1
          max: 24
          mode: slider
          step: 1
    max_off_hours:
      name: Max Consecutive OFF Hours
      description: "Max hours the device can stay OFF in a row before being forced ON."
      default: 5
      selector:
        number:
          min: 1
          max: 24
          mode: slider
          step: 1
    always_on_price:
      name: Always ON Price Threshold
      description: "If price exceeds this value, force device ON (override schedule)."
      default: 5.0
      selector:
        number:
          min: 0.0
          max: 20.0
          step: 0.1
    turn_on_actions:
      name: Turn ON Actions
      description: "Actions to run when turning the device ON (e.g., switch on the heater)."
      selector:
        action: {}
    turn_off_actions:
      name: Turn OFF Actions
      description: "Actions to run when turning the device OFF."
      selector:
        action: {}

variables:
  sensor_entity: !input nordpool_sensor
  hours_on: !input expensive_hours_on
