blueprint:
  name: Nordpool – varmtvann dyreste timer + maks AV-tid
  description: >
    Slår varmtvannstank PÅ i et valgt antall av de dyreste timene i døgnet
    basert på Nordpool-priser. Hvis tanken har vært AV i mer enn X timer,
    tvinges den PÅ i 1 time før normal prisstyring gjenopptas.
  domain: automation

  input:
    nordpool_sensor:
      name: Nordpool-prissensor
      selector:
        entity:
          domain: sensor

    target_entity:
      name: Enhet som styres (varmtvann)
      selector:
        entity:

    expensive_hours:
      name: Antall dyreste timer per døgn
      default: 4
      selector:
        number:
          min: 1
          max: 24

    max_off_hours:
      name: Maks sammenhengende timer AV
      description: >
        Hvis enheten har vært AV lenger enn dette,
        tvinges den PÅ i 1 time.
      default: 5
      selector:
        number:
          min: 1
          max: 24

    turn_on_action:
      name: Handling for å slå PÅ
      selector:
        action: {}

    turn_off_action:
      name: Handling for å slå AV
      selector:
        action: {}

variables:
  ga: !input nordpool_sensor
  target: !input target_entity
  eh: !input expensive_hours
  mo: !input max_off_hours
  force_flag: input_boolean.nordpool_force_hotwater

trigger:
  - platform: time_pattern
    minutes: "/30"

action:
  - variables:
      # Nordpool-priser
      prices: >
        {% set today = state_attr(ga, 'today') %}
        {% set tomorrow = state_attr(ga, 'tomorrow') %}
        {{ (today + tomorrow) if tomorrow else today }}

      # (time, pris)-par
      priced_hours: >
        {% set out = [] %}
        {% for i in range(prices | length) %}
          {% set out = out + [(i, prices[i])] %}
        {% endfor %}
        {{ out }}

      # Sortert etter pris (dyrest først)
      sorted_hours: >
        {{ priced_hours | sort(attribute=1, reverse=true) }}

      # Dyreste timer
      expensive_hour_indexes: >
        {{ sorted_hours[:eh] | map(attribute=0) | list }}

      current_hour: "{{ now().hour }}"
      is_expensive_hour: "{{ current_hour in expensive_hour_indexes }}"

      is_on: "{{ states(target) != 'off' }}"
      force_active: "{{ is_state(force_flag, 'on') }}"

      hours_off: >
        {% if is_on %}
          0
        {% else %}
          {{ (as_timestamp(now()) - as_timestamp(states[target].last_changed)) / 3600 }}
        {% endif %}

  - choose:

      # 🆘 Tvangs-PÅ hvis AV for lenge
      - conditions:
          - condition: template
            value_template: "{{ hours_off >= mo and not force_active }}"
        sequence:
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.nordpool_force_hotwater
          - !input turn_on_action
          - delay: "01:00:00"
          - service: input_boolean.turn_off
            target:
              entity_id: input_boolean.nordpool_force_hotwater

      # 🔥 Tvangs-PÅ aktiv
      - conditions:
          - condition: template
            value_template: "{{ force_active }}"
        sequence:
          - !input turn_on_action

      # 💰 Dyreste timer
      - conditions:
          - condition: template
            value_template: "{{ is_expensive_hour }}"
        sequence:
          - !input turn_on_action

    default:
      - !input turn_off_action

mode: single
