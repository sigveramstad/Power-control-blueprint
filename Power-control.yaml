blueprint:
  name: Nordpool – Water heater on MOST EXPENSIVE hours + force
  description: >
    Turns a water heater ON during the X most expensive hours based on
    Nordpool prices. Supports 15-minute prices by calculating the correct
    hourly price as the average of 4 intervals.
    If the water heater has been OFF for more than N hours, it is forced ON
    for 1 hour regardless of price.
  domain: automation

  input:
    nordpool_sensor:
      name: Nordpool price sensor
      description: Sensor providing Nordpool prices (15 min or hourly)
      selector:
        entity:
          domain: sensor

    target_entity:
      name: Water heater switch
      selector:
        entity:
          domain: switch

    expensive_hours:
      name: Number of most expensive hours (ON)
      default: 12
      selector:
        number:
          min: 1
          max: 24

    max_off_hours:
      name: Max continuous OFF time (hours)
      default: 5
      selector:
        number:
          min: 1
          max: 24

mode: single

variables:
  price_sensor: !input nordpool_sensor
  target_switch: !input target_entity
  expensive_count: !input expensive_hours
  max_off: !input max_off_hours

  force_flag: input_boolean.nordpool_force_hotwater

trigger:
  - platform: time_pattern
    minutes: "/30"

action:
  - variables:

      # --- READ PRICE DATA ---
      prices_15m: "{{ state_attr(price_sensor, 'today') or [] }}"

      # --- BUILD 24 HOURLY PRICES (AVERAGE OF 4x15 MIN) ---
      prices_hourly: >
        {% set out = [] %}
        {% for h in range(24) %}
          {% set chunk = prices_15m[h*4:(h+1)*4] %}
          {% if chunk | length == 4 %}
            {% set out = out + [ (chunk | sum) / 4 ] %}
          {% else %}
            {% set out = out + [0] %}
          {% endif %}
        {% endfor %}
        {{ out }}

      # --- MAP HOUR → PRICE ---
      priced_hours: >
        {% set out = [] %}
        {% for i in range(prices_hourly | length) %}
          {% set out = out + [(i, prices_hourly[i])] %}
        {% endfor %}
        {{ out }}

      # --- SORT BY PRICE (DESCENDING) ---
      sorted_hours: >
        {{ priced_hours | sort(attribute=1, reverse=true) }}

      # --- SELECT MOST EXPENSIVE HOURS ---
      expensive_hours_idx: >
        {% set res = [] %}
        {% for h in sorted_hours[:expensive_count] %}
          {% set res = res + [h[0]] %}
        {% endfor %}
        {{ res }}

      # --- CURRENT STATUS ---
      current_hour: "{{ now().hour }}"
      is_expensive: "{{ current_hour in expensive_hours_idx }}"

      is_on: "{{ is_state(target_switch, 'on') }}"
      force_active: "{{ is_state(force_flag, 'on') }}"

      hours_off: >
        {% if is_on %}
          0
        {% else %}
          {{ (as_timestamp(now()) - as_timestamp(states[target_switch].last_changed)) / 3600 }}
        {% endif %}

      force_elapsed: >
        {% if force_active %}
          {{ as_timestamp(now()) - as_timestamp(states[force_flag].last_changed) }}
        {% else %}
          0
        {% endif %}

  - choose:

      # 🔴 START FORCE MODE (price independent)
      - conditions:
          - condition: template
            value_template: "{{ hours_off >= max_off and not force_active }}"
        sequence:
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.nordpool_force_hotwater
          - service: switch.turn_on
            target:
              entity_id: !input target_entity

      # 🔥 FORCE MODE ACTIVE (max 1 hour)
      - conditions:
          - condition: template
            value_template: "{{ force_active and force_elapsed < 3600 }}"
        sequence:
          - service: switch.turn_on
            target:
              entity_id: !input target_entity

      # 💰 MOST EXPENSIVE HOURS
      - conditions:
          - condition: template
            value_template: "{{ is_expensive }}"
        sequence:
          - service: switch.turn_on
            target:
              entity_id: !input target_entity

    # ❄️ OTHERWISE OFF
    default:
      - service: switch.turn_off
        target:
          entity_id: !input target_entity

  # 🔁 END FORCE MODE AFTER 1 HOUR
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ force_active and force_elapsed >= 3600 }}"
        sequence:
          - service: input_boolean.turn_off
            target:
              entity_id: input_boolean.nordpool_force_hotwater
