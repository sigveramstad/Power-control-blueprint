blueprint:
  name: Nordpool price based on (most expensive hours)
  description: >
    Turns devices ON during the most expensive Nordpool hours.
    Allows selecting grid area, number of expensive hours,
    always-on price, and turn on/off actions.
  domain: automation

  input:
    grid_area:
      name: Grid area sensor
      description: Nordpool price sensor for your grid area
      selector:
        entity:
          domain: sensor
          integration: nordpool
          multiple: false

    hours_on:
      name: Hours ON (most expensive)
      description: Number of most expensive hours per day when device should be ON
      default: 6
      selector:
        number:
          min: 0
          max: 24
          step: 1
          mode: slider

    always_on_price:
      name: Always ON price
      description: If price is above this value, device is always ON
      default: 0.0
      selector:
        number:
          min: 0
          max: 20
          step: 0.1
          mode: slider

    turn_on:
      name: Turn ON actions
      selector:
        action: {}

    turn_off:
      name: Turn OFF actions
      selector:
        action: {}

mode: single

variables:
  grid_area_var: !input grid_area
  hours_on_var: !input hours_on
  always_on_price_var: !input always_on_price

  prices: "{{ state_attr(grid_area_var, 'today') | list }}"
  idx: "{{ now().hour }}"
  price: "{{ prices[idx] | float if idx < prices | length else prices[-1] | float }}"

  # Sort prices from most expensive to cheapest
  sorted_prices_desc: "{{ prices | sort(reverse=true) }}"

  # Rank of current hour among most expensive hours
  expensive_rank: "{{ sorted_prices_desc.index(price) + 1 }}"

  condition_always_on: "{{ price >= always_on_price_var | float }}"
  condition_expensive_hour: "{{ expensive_rank <= hours_on_var | int }}"

  result_on: "{{ condition_always_on or condition_expensive_hour }}"

trigger:
  - platform: time_pattern
    minutes: 0

action:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ result_on }}"
        sequence: !input turn_on
    default: !input turn_off
